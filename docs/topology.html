<script>
const svg = document.getElementById('topo');
const VBW = svg.viewBox.baseVal.width, VBH = svg.viewBox.baseVal.height;
const wrap = document.getElementById('wrap');
let scale = 1;
function apply() {
  const maxW = wrap.clientWidth - 32, maxH = wrap.clientHeight - 32;
  const base = Math.min(maxW / VBW, maxH / VBH);
  const w = VBW * base * scale, h = VBH * base * scale;
  svg.style.width = w + 'px';
  svg.style.height = h + 'px';
  svg.style.maxWidth = 'none';
  document.getElementById('zlabel').textContent = Math.round(scale * 100) + '%';
}
function setZoom(d) { scale = Math.min(4, Math.max(0.3, scale + d)); apply(); }
function fit() { scale = 1; apply(); }
window.addEventListener('resize', apply);
window.addEventListener('load', apply);
apply();
</script>
