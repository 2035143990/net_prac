frr version 10.6
frr defaults traditional
hostname agg-l1
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.31/32
!
interface eth1
 ip address 10.0.30.2/30
!
interface eth2
 ip address 10.0.30.6/30
!
interface eth3.201
 ip address 10.20.0.252/24
!
router ospf
 ospf router-id 10.255.0.31
 network 10.255.0.31/32 area 0
 network 10.0.30.0/30 area 0
 network 10.0.30.4/30 area 0
 network 10.20.0.0/24 area 0
 passive-interface lo
 passive-interface eth3.201
 maximum-paths 4
!
ip route 10.70.0.0/24 10.0.30.1 1
ip route 10.70.0.0/24 10.0.30.5 2
!
line vty
!
