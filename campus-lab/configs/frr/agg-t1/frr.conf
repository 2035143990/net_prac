frr version 10.6
frr defaults traditional
hostname agg-t1
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.11/32
!
interface eth1
 ip address 10.0.10.2/30
!
interface eth2
 ip address 10.0.10.6/30
!
interface eth3.101
 ip address 10.10.0.252/24
!
interface eth3.500
 ip address 10.50.0.252/24
!
interface eth4.102
 ip address 10.11.0.252/24
!
router ospf
 ospf router-id 10.255.0.11
 network 10.255.0.11/32 area 0
 network 10.0.10.0/30 area 0
 network 10.0.10.4/30 area 0
 network 10.10.0.0/24 area 0
 network 10.50.0.0/24 area 0
 network 10.11.0.0/24 area 0
 passive-interface lo
 passive-interface eth3.101
 passive-interface eth3.500
 passive-interface eth4.102
 maximum-paths 4
!
ip route 10.70.0.0/24 10.0.10.1 1
ip route 10.70.0.0/24 10.0.10.5 2
!
line vty
!
