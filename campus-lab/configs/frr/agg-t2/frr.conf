frr version 10.6
frr defaults traditional
hostname agg-t2
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.12/32
!
interface eth1
 ip address 10.0.10.10/30
!
interface eth2
 ip address 10.0.10.14/30
!
interface eth3.101
 ip address 10.10.0.253/24
!
interface eth3.500
 ip address 10.50.0.253/24
!
interface eth4.102
 ip address 10.11.0.253/24
!
router ospf
 ospf router-id 10.255.0.12
 network 10.255.0.12/32 area 0
 network 10.0.10.8/30 area 0
 network 10.0.10.12/30 area 0
 network 10.10.0.0/24 area 0
 network 10.50.0.0/24 area 0
 network 10.11.0.0/24 area 0
 passive-interface lo
 passive-interface eth3.101
 passive-interface eth3.500
 passive-interface eth4.102
 maximum-paths 4
!
ip route 10.70.0.0/24 10.0.10.9 1
ip route 10.70.0.0/24 10.0.10.13 2
!
line vty
!
