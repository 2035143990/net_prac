frr version 10.6
frr defaults traditional
hostname agg-d1
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.21/32
!
interface eth1
 ip address 10.0.20.2/30
!
interface eth2
 ip address 10.0.20.6/30
!
interface eth3.301
 ip address 10.32.0.252/24
!
interface eth3.510
 ip address 10.51.0.252/24
!
router ospf
 ospf router-id 10.255.0.21
 network 10.255.0.21/32 area 0
 network 10.0.20.0/30 area 0
 network 10.0.20.4/30 area 0
 network 10.32.0.0/24 area 0
 network 10.51.0.0/24 area 0
 passive-interface lo
 passive-interface eth3.301
 passive-interface eth3.510
 maximum-paths 4
!
ip route 10.70.0.0/24 10.0.20.1 1
ip route 10.70.0.0/24 10.0.20.5 2
!
line vty
!
