frr version 10.6
frr defaults traditional
hostname agg-l2
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.32/32
!
interface eth1
 ip address 10.0.30.10/30
!
interface eth2
 ip address 10.0.30.14/30
!
interface eth3.201
 ip address 10.20.0.253/24
!
router ospf
 ospf router-id 10.255.0.32
 network 10.255.0.32/32 area 0
 network 10.0.30.8/30 area 0
 network 10.0.30.12/30 area 0
 network 10.20.0.0/24 area 0
 passive-interface lo
 passive-interface eth3.201
 maximum-paths 4
!
ip route 10.70.0.0/24 10.0.30.9 1
ip route 10.70.0.0/24 10.0.30.13 2
!
line vty
!
