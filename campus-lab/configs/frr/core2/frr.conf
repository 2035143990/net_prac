frr version 10.6
frr defaults traditional
hostname core2
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.2/32
!
interface eth1
 ip address 10.0.10.5/30
!
interface eth2
 ip address 10.0.20.5/30
!
interface eth3
 ip address 10.0.30.5/30
!
interface eth4
 ip address 10.0.40.5/30
!
interface eth5
 ip address 10.0.50.5/30
!
interface eth6
 ip address 10.0.10.13/30
!
interface eth7
 ip address 10.0.20.13/30
!
interface eth8
 ip address 10.0.30.13/30
!
interface eth9
 ip address 10.0.40.13/30
!
interface eth10
 ip address 10.0.50.13/30
!
interface bond0
 ip address 10.0.0.2/30
!
interface eth12
 ip address 10.0.100.2/24
!
interface eth13.70
 ip address 10.60.0.253/24
!
interface eth13.90
 ip address 10.70.0.3/24
!
router ospf
 ospf router-id 10.255.0.2
 network 10.255.0.2/32 area 0
 network 10.0.10.4/30 area 0
 network 10.0.20.4/30 area 0
 network 10.0.30.4/30 area 0
 network 10.0.40.4/30 area 0
 network 10.0.50.4/30 area 0
 network 10.0.10.12/30 area 0
 network 10.0.20.12/30 area 0
 network 10.0.30.12/30 area 0
 network 10.0.40.12/30 area 0
 network 10.0.50.12/30 area 0
 network 10.0.0.0/30 area 0
 network 10.60.0.0/24 area 0
 network 10.70.0.0/24 area 0
 passive-interface lo
 passive-interface eth13.70
 passive-interface eth13.90
 maximum-paths 4
 default-information originate
!
ip route 0.0.0.0/0 10.0.100.254
!
line vty
!
