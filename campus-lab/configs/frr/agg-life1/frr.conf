frr version 10.6
frr defaults traditional
hostname agg-life1
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.51/32
!
interface eth1
 ip address 10.0.50.2/30
!
interface eth2
 ip address 10.0.50.6/30
!
interface eth3.61
 ip address 10.64.0.252/24
!
router ospf
 ospf router-id 10.255.0.51
 network 10.255.0.51/32 area 0
 network 10.0.50.0/30 area 0
 network 10.0.50.4/30 area 0
 network 10.64.0.0/24 area 0
 passive-interface lo
 passive-interface eth3.61
 maximum-paths 4
!
ip route 10.70.0.0/24 10.0.50.1 1
ip route 10.70.0.0/24 10.0.50.5 2
!
line vty
!
