frr version 10.6
frr defaults traditional
hostname agg-lib2
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.42/32
!
interface eth1
 ip address 10.0.40.10/30
!
interface eth2
 ip address 10.0.40.14/30
!
interface eth3.50
 ip address 10.55.0.253/24
!
router ospf
 ospf router-id 10.255.0.42
 network 10.255.0.42/32 area 0
 network 10.0.40.8/30 area 0
 network 10.0.40.12/30 area 0
 network 10.55.0.0/24 area 0
 passive-interface lo
 passive-interface eth3.50
 maximum-paths 4
!
ip route 10.70.0.0/24 10.0.40.9 1
ip route 10.70.0.0/24 10.0.40.13 2
!
line vty
!
