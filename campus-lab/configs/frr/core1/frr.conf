frr version 10.6
frr defaults traditional
hostname core1
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.1/32
!
interface eth1
 ip address 10.0.10.1/30
!
interface eth2
 ip address 10.0.20.1/30
!
interface eth3
 ip address 10.0.30.1/30
!
interface eth4
 ip address 10.0.40.1/30
!
interface eth5
 ip address 10.0.50.1/30
!
interface eth6
 ip address 10.0.10.9/30
!
interface eth7
 ip address 10.0.20.9/30
!
interface eth8
 ip address 10.0.30.9/30
!
interface eth9
 ip address 10.0.40.9/30
!
interface eth10
 ip address 10.0.50.9/30
!
interface bond0
 ip address 10.0.0.1/30
!
interface eth12
 ip address 10.0.100.1/24
!
interface eth13.70
 ip address 10.60.0.252/24
!
interface eth13.90
 ip address 10.70.0.2/24
!
router ospf
 ospf router-id 10.255.0.1
 network 10.255.0.1/32 area 0
 network 10.0.10.0/30 area 0
 network 10.0.20.0/30 area 0
 network 10.0.30.0/30 area 0
 network 10.0.40.0/30 area 0
 network 10.0.50.0/30 area 0
 network 10.0.10.8/30 area 0
 network 10.0.20.8/30 area 0
 network 10.0.30.8/30 area 0
 network 10.0.40.8/30 area 0
 network 10.0.50.8/30 area 0
 network 10.0.0.0/30 area 0
 network 10.60.0.0/24 area 0
 network 10.70.0.0/24 area 0
 passive-interface lo
 passive-interface eth13.70
 passive-interface eth13.90
 maximum-paths 4
 default-information originate
!
ip route 0.0.0.0/0 10.0.100.254
!
line vty
!
