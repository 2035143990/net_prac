frr version 10.6
frr defaults traditional
hostname r2
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.102/32
!
interface eth1
 ip address 10.90.1.2/24
!
interface eth2
 ip address 203.0.113.2/24
!
ip route 0.0.0.0/0 203.0.113.100
ip route 0.0.0.0/0 10.90.1.1 200
ip route 10.0.0.0/8 10.90.1.253
ip route 198.51.100.0/24 10.90.1.253
!
line vty
!
