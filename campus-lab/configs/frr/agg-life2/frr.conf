frr version 10.6
frr defaults traditional
hostname agg-life2
log file /var/log/frr/frr.log
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.52/32
!
interface eth1
 ip address 10.0.50.10/30
!
interface eth2
 ip address 10.0.50.14/30
!
interface eth3.61
 ip address 10.64.0.253/24
!
router ospf
 ospf router-id 10.255.0.52
 network 10.255.0.52/32 area 0
 network 10.0.50.8/30 area 0
 network 10.0.50.12/30 area 0
 network 10.64.0.0/24 area 0
 passive-interface lo
 passive-interface eth3.61
 maximum-paths 4
!
ip route 10.70.0.0/24 10.0.50.9 1
ip route 10.70.0.0/24 10.0.50.13 2
!
line vty
!
